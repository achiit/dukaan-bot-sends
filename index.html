<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Telegram Pro</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: 'Segoe UI', -apple-system, Arial, sans-serif;
    background: #0e1621;
    min-height: 100vh;
    padding: 15px;
    overflow-x: hidden;
    color: #fff;
    background-image:
      radial-gradient(circle at 10% 0%, rgba(41,168,255,0.25), transparent 45%),
      radial-gradient(circle at 90% 100%, rgba(135,80,255,0.25), transparent 45%),
      radial-gradient(circle at 50% 50%, rgba(0,200,255,0.08), transparent 60%);
  }
  .app {
    max-width: 520px;
    margin: auto;
    position: relative;
    z-index: 2;
  }

  /* ============ BACKGROUND BLOBS ============ */
  .blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(70px);
    opacity: 0.45;
    z-index: 0;
    animation: float 12s ease-in-out infinite;
    pointer-events: none;
  }
  .blob1 { width: 220px; height: 220px; background: #29a8ff; top: -40px; left: -60px; }
  .blob2 { width: 260px; height: 260px; background: #8750ff; bottom: -80px; right: -80px; animation-delay: -4s; }
  .blob3 { width: 180px; height: 180px; background: #00e0ff; top: 40%; left: 60%; animation-delay: -8s; }
  @keyframes float {
    0%,100% { transform: translate(0,0) scale(1); }
    50%     { transform: translate(20px,-25px) scale(1.15); }
  }

  /* ============ HEADER (Telegram style) ============ */
  .header {
    background: linear-gradient(135deg, #2AABEE 0%, #229ED9 45%, #1c7ed6 100%);
    border-radius: 22px;
    padding: 20px 22px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow:
      0 10px 30px rgba(41,168,255,0.45),
      0 4px 0 rgba(0,0,0,0.15),
      inset 0 1px 0 rgba(255,255,255,0.35);
    margin-bottom: 18px;
    position: relative;
    overflow: hidden;
    transform: translateZ(0);
  }
  .header::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 20% 20%, rgba(255,255,255,0.25), transparent 40%),
      radial-gradient(circle at 80% 80%, rgba(255,255,255,0.15), transparent 45%);
    pointer-events: none;
  }
  .header-left { position: relative; z-index: 2; }
  .header-left h1 {
    font-size: 21px;
    font-weight: 800;
    letter-spacing: 0.3px;
    display: flex;
    align-items: center;
    gap: 8px;
    text-shadow: 0 2px 6px rgba(0,0,0,0.25);
  }
  .header-left .logo {
    width: 34px; height: 34px;
    background: rgba(255,255,255,0.22);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    box-shadow: inset 0 2px 5px rgba(255,255,255,0.3), 0 3px 8px rgba(0,0,0,0.2);
  }
  .header-left p {
    font-size: 12px;
    opacity: 0.9;
    margin-top: 5px;
    margin-left: 42px;
  }
  .plus-btn {
    width: 52px; height: 52px;
    border-radius: 50%;
    background: linear-gradient(145deg, #ffffff, #e6f4ff);
    color: #229ED9;
    border: none;
    font-size: 30px;
    font-weight: 300;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    line-height: 1;
    position: relative;
    z-index: 2;
    box-shadow:
      0 6px 16px rgba(0,0,0,0.25),
      inset 0 -3px 6px rgba(0,0,0,0.08),
      inset 0 3px 6px rgba(255,255,255,0.9);
    transition: 0.25s cubic-bezier(.2,.9,.3,1.4);
  }
  .plus-btn:hover {
    transform: rotate(90deg) scale(1.08);
    box-shadow: 0 10px 22px rgba(0,0,0,0.35);
  }
  .plus-btn:active { transform: rotate(90deg) scale(0.95); }

  /* ============ CREATE PANEL ============ */
  .create-panel {
    background: linear-gradient(160deg, #17212b, #1d2a38);
    border-radius: 20px;
    padding: 22px;
    margin-bottom: 18px;
    display: none;
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow:
      0 14px 34px rgba(0,0,0,0.5),
      inset 0 1px 0 rgba(255,255,255,0.08);
    animation: pop 0.4s cubic-bezier(.2,.9,.3,1.3);
  }
  .create-panel.open { display: block; }
  @keyframes pop {
    0%   { opacity: 0; transform: scale(0.92) translateY(-10px); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
  }
  .create-panel h2 {
    color: #4fc3f7;
    font-size: 17px;
    margin-bottom: 4px;
    display: flex; align-items: center; gap: 8px;
  }
  .create-panel .sub {
    color: #8fa5b8;
    font-size: 12px;
    margin-bottom: 16px;
  }

  label {
    display: block;
    margin-top: 12px;
    font-weight: 600;
    color: #b6c6d6;
    font-size: 12.5px;
    letter-spacing: 0.2px;
  }
  input, textarea, select {
    width: 100%;
    padding: 13px 14px;
    margin-top: 6px;
    border: 1.5px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    font-size: 14px;
    font-family: inherit;
    outline: none;
    background: rgba(255,255,255,0.04);
    color: #fff;
    transition: 0.25s;
    box-shadow: inset 0 2px 6px rgba(0,0,0,0.35);
  }
  input::placeholder, textarea::placeholder { color: #5b6b7c; }
  input:focus, textarea:focus, select:focus {
    border-color: #229ED9;
    background: rgba(41,168,255,0.08);
    box-shadow:
      inset 0 2px 6px rgba(0,0,0,0.35),
      0 0 0 4px rgba(41,168,255,0.18);
  }
  textarea { resize: vertical; }
  select option { background: #17212b; color: #fff; }

  /* ============ BUTTONS ============ */
  .btn {
    padding: 13px 20px;
    border: none;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: 0.2s cubic-bezier(.2,.9,.3,1.4);
    letter-spacing: 0.3px;
    position: relative;
    overflow: hidden;
    transform: translateZ(0);
  }
  .btn:active { transform: scale(0.96); }
  .btn-green {
    background: linear-gradient(145deg, #2ecc71, #27ae60);
    color: white;
    box-shadow: 0 6px 0 #1e8449, 0 8px 18px rgba(46,204,113,0.4);
  }
  .btn-green:hover { box-shadow: 0 6px 0 #1e8449, 0 12px 24px rgba(46,204,113,0.6); }
  .btn-green:active { box-shadow: 0 3px 0 #1e8449, 0 4px 10px rgba(46,204,113,0.4); transform: translateY(3px) scale(0.98); }

  .btn-blue {
    background: linear-gradient(145deg, #2AABEE, #1c7ed6);
    color: white;
    box-shadow: 0 6px 0 #1565a0, 0 8px 18px rgba(41,168,255,0.45);
  }
  .btn-blue:hover { box-shadow: 0 6px 0 #1565a0, 0 12px 24px rgba(41,168,255,0.65); }
  .btn-blue:active { box-shadow: 0 3px 0 #1565a0, 0 4px 10px rgba(41,168,255,0.4); transform: translateY(3px) scale(0.98); }

  .btn-gray {
    background: linear-gradient(145deg, #3a4a5c, #2c3947);
    color: #c7d5e2;
    box-shadow: 0 5px 0 #1e2833, 0 8px 16px rgba(0,0,0,0.35);
  }
  .btn-gray:active { box-shadow: 0 2px 0 #1e2833; transform: translateY(3px) scale(0.98); }

  .btn-red {
    background: linear-gradient(145deg, #ff5c5c, #e63946);
    color: white;
    box-shadow: 0 5px 0 #a52a2a, 0 8px 16px rgba(230,57,70,0.4);
  }
  .btn-red:active { box-shadow: 0 2px 0 #a52a2a; transform: translateY(3px) scale(0.98); }

  .btn-full { width: 100%; margin-top: 18px; padding: 15px; font-size: 15px; }
  .btn-row { display: flex; gap: 10px; margin-top: 18px; }
  .btn-row .btn { flex: 1; }

  /* ============ SECTION TITLE ============ */
  .section-title {
    color: #c7d5e2;
    font-size: 13px;
    font-weight: 700;
    margin: 14px 0 12px 6px;
    display: flex; align-items: center; gap: 8px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .section-title .count {
    background: linear-gradient(135deg, #2AABEE, #1c7ed6);
    color: white;
    padding: 2px 10px;
    border-radius: 10px;
    font-size: 11px;
    box-shadow: 0 3px 8px rgba(41,168,255,0.5);
  }

  /* ============ BOARD CARDS (3D) ============ */
  .board-card {
    background: linear-gradient(145deg, #1d2a38, #17212b);
    border-radius: 18px;
    padding: 18px 20px;
    margin-bottom: 14px;
    cursor: pointer;
    transition: 0.28s cubic-bezier(.2,.9,.3,1.3);
    border: 1px solid rgba(255,255,255,0.06);
    position: relative;
    overflow: hidden;
    box-shadow:
      0 8px 20px rgba(0,0,0,0.45),
      inset 0 1px 0 rgba(255,255,255,0.06);
    transform: translateZ(0);
  }
  .board-card::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 4px;
    background: linear-gradient(180deg, #2AABEE, #8750ff);
    border-radius: 0 4px 4px 0;
    transition: 0.3s;
  }
  .board-card::after {
    content: '';
    position: absolute;
    right: -60%;
    top: -60%;
    width: 120%;
    height: 120%;
    background: radial-gradient(circle, rgba(41,168,255,0.15), transparent 55%);
    opacity: 0;
    transition: 0.4s;
    pointer-events: none;
  }
  .board-card:hover {
    transform: translateY(-4px) translateZ(0);
    box-shadow:
      0 16px 34px rgba(41,168,255,0.35),
      inset 0 1px 0 rgba(255,255,255,0.1);
    border-color: rgba(41,168,255,0.4);
  }
  .board-card:hover::after { opacity: 1; }
  .board-card:active { transform: translateY(-1px) scale(0.99); }

  .board-card .name {
    font-size: 16px;
    font-weight: 800;
    color: #4fc3f7;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 10px;
    text-shadow: 0 2px 6px rgba(41,168,255,0.3);
  }
  .board-card .avatar {
    width: 38px; height: 38px;
    border-radius: 50%;
    background: linear-gradient(145deg, #2AABEE, #8750ff);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 800; color: white;
    box-shadow:
      0 4px 10px rgba(41,168,255,0.5),
      inset 0 1px 0 rgba(255,255,255,0.4);
    text-shadow: 0 1px 2px rgba(0,0,0,0.3);
  }
  .board-card .row {
    font-size: 12px;
    color: #8fa5b8;
    margin-top: 6px;
    display: flex;
    gap: 8px;
    align-items: center;
    padding-left: 2px;
  }
  .board-card .row b {
    color: #b6c6d6;
    min-width: 62px;
    font-weight: 600;
  }
  .board-card .row .val {
    font-family: 'Consolas', monospace;
    color: #4fc3f7;
    word-break: break-all;
    font-size: 11.5px;
  }
  .board-card .arrow {
    position: absolute;
    right: 18px;
    top: 50%;
    transform: translateY(-50%);
    color: #3a4a5c;
    font-size: 26px;
    transition: 0.25s;
    font-weight: 300;
  }
  .board-card:hover .arrow {
    color: #4fc3f7;
    transform: translateY(-50%) translateX(5px);
  }
  .board-card .del-btn {
    position: absolute;
    right: 12px;
    top: 12px;
    background: rgba(230,57,70,0.15);
    color: #ff6b6b;
    border: 1px solid rgba(230,57,70,0.3);
    width: 28px; height: 28px;
    border-radius: 50%;
    font-size: 13px;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    line-height: 1;
    transition: 0.2s;
    z-index: 5;
  }
  .board-card:hover .del-btn { display: flex; }
  .board-card .del-btn:hover {
    background: #e63946;
    color: white;
    transform: scale(1.15);
  }

  /* ============ EMPTY STATE ============ */
  .empty-state {
    background: linear-gradient(145deg, #1d2a38, #17212b);
    border-radius: 18px;
    padding: 45px 22px;
    text-align: center;
    color: #8fa5b8;
    border: 1px dashed rgba(41,168,255,0.3);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.06);
  }
  .empty-state .big {
    font-size: 58px;
    margin-bottom: 14px;
    filter: drop-shadow(0 6px 14px rgba(41,168,255,0.4));
    animation: bounce 2.5s ease-in-out infinite;
  }
  @keyframes bounce {
    0%,100% { transform: translateY(0); }
    50%     { transform: translateY(-8px); }
  }
  .empty-state p { font-size: 14px; line-height: 1.6; }
  .empty-state b { color: #4fc3f7; }

  /* ============ FORM SCREEN ============ */
  .form-screen { display: none; animation: fadeIn 0.4s ease; }
  .form-screen.open { display: block; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .form-header {
    background: linear-gradient(145deg, #1d2a38, #17212b);
    border-radius: 18px;
    padding: 16px 18px;
    margin-bottom: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border: 1px solid rgba(255,255,255,0.06);
    box-shadow:
      0 8px 20px rgba(0,0,0,0.4),
      inset 0 1px 0 rgba(255,255,255,0.06);
  }
  .form-header .title {
    color: #4fc3f7;
    font-size: 17px;
    font-weight: 800;
    text-shadow: 0 2px 6px rgba(41,168,255,0.3);
  }
  .form-header .sub {
    font-size: 11.5px;
    color: #8fa5b8;
    margin-top: 4px;
    font-family: monospace;
  }
  .back-btn {
    background: linear-gradient(145deg, #3a4a5c, #2c3947);
    border: none;
    padding: 9px 16px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 700;
    color: #c7d5e2;
    cursor: pointer;
    box-shadow: 0 4px 0 #1e2833, 0 6px 12px rgba(0,0,0,0.35);
    transition: 0.15s;
  }
  .back-btn:active { box-shadow: 0 1px 0 #1e2833; transform: translateY(3px); }

  .form-card {
    background: linear-gradient(145deg, #1d2a38, #17212b);
    border-radius: 20px;
    padding: 24px;
    border: 1px solid rgba(255,255,255,0.06);
    box-shadow:
      0 14px 34px rgba(0,0,0,0.5),
      inset 0 1px 0 rgba(255,255,255,0.06);
  }

  /* File input special */
  input[type="file"] {
    padding: 11px 12px;
    cursor: pointer;
    font-size: 12.5px;
  }
  input[type="file"]::file-selector-button {
    background: linear-gradient(145deg, #2AABEE, #1c7ed6);
    color: white;
    border: none;
    padding: 7px 14px;
    border-radius: 8px;
    font-weight: 700;
    cursor: pointer;
    margin-right: 10px;
    font-size: 12px;
    box-shadow: 0 3px 0 #1565a0;
    transition: 0.15s;
  }
  input[type="file"]::file-selector-button:active {
    transform: translateY(2px);
    box-shadow: 0 1px 0 #1565a0;
  }

  /* ============ STATUS ============ */
  #status {
    text-align: center;
    margin-top: 16px;
    font-weight: 700;
    font-size: 13.5px;
    min-height: 20px;
    padding: 10px;
    border-radius: 12px;
    transition: 0.3s;
    letter-spacing: 0.2px;
  }
  #status:empty { display: none; }
  .success {
    color: #2ecc71;
    background: rgba(46,204,113,0.12);
    border: 1px solid rgba(46,204,113,0.35);
    box-shadow: 0 0 20px rgba(46,204,113,0.15);
  }
  .error {
    color: #ff6b6b;
    background: rgba(230,57,70,0.12);
    border: 1px solid rgba(230,57,70,0.35);
    box-shadow: 0 0 20px rgba(230,57,70,0.15);
  }
  .info {
    color: #4fc3f7;
    background: rgba(41,168,255,0.12);
    border: 1px solid rgba(41,168,255,0.35);
    box-shadow: 0 0 20px rgba(41,168,255,0.15);
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { opacity: 1; }
    50%     { opacity: 0.65; }
  }

  /* ============ LOADER SPIN ============ */
  .spinner {
    display: inline-block;
    width: 12px; height: 12px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: #4fc3f7;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin-right: 6px;
    vertical-align: -1px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ============ TOAST ============ */
  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: linear-gradient(145deg, #2ecc71, #27ae60);
    color: white;
    padding: 13px 26px;
    border-radius: 14px;
    font-weight: 700;
    font-size: 14px;
    box-shadow: 0 10px 30px rgba(46,204,113,0.5);
    z-index: 999;
    opacity: 0;
    transition: 0.4s cubic-bezier(.2,.9,.3,1.3);
    pointer-events: none;
  }
  .toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }

  /* ============ SCROLLBAR ============ */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: linear-gradient(180deg, #2AABEE, #8750ff);
    border-radius: 3px;
  }
</style>
</head>
<body>

<!-- Background blobs -->
<div class="blob blob1"></div>
<div class="blob blob2"></div>
<div class="blob blob3"></div>

<div class="app">

  <!-- ============ DASHBOARD ============ -->
  <div id="dashboardView">

    <div class="header">
      <div class="header-left">
        <h1>
          <span class="logo">✈️</span>
          Telegram Pro
        </h1>
        <p id="boardCountText">0 boards saved</p>
      </div>
      <button class="plus-btn" onclick="toggleCreate()" title="Naya board">+</button>
    </div>

    <!-- Create panel -->
    <div class="create-panel" id="createPanel">
      <h2>✨ Naya Board Banao</h2>
      <p class="sub">Token + Chat ID daal ke save karo — fast!</p>

      <label>📛 Board ka Naam:</label>
      <input type="text" id="newBoardName" placeholder="Jaise: My Group, Friends...">

      <label>🔑 Bot Token:</label>
      <input type="password" id="newToken" placeholder="123456:ABC-DEF...">

      <label>🆔 Chat ID:</label>
      <input type="text" id="newChatId" placeholder="8336054876">

      <div class="btn-row">
        <button class="btn btn-gray" onclick="toggleCreate()">Cancel</button>
        <button class="btn btn-green" onclick="saveBoard()">💾 Save Board</button>
      </div>
    </div>

    <div class="section-title">
      <span>📌 Saved Boards</span>
      <span class="count" id="boardCount">0</span>
    </div>

    <div id="boardsList"></div>
  </div>

  <!-- ============ FORM VIEW ============ -->
  <div class="form-screen" id="formView">

    <div class="form-header">
      <div>
        <div class="title" id="activeBoardName">📌 Board</div>
        <div class="sub" id="activeBoardChat">Chat ID: —</div>
      </div>
      <button class="back-btn" onclick="goBack()">← Back</button>
    </div>

    <div class="form-card">
      <form id="tgForm">
        <label>👤 Naam:</label>
        <input type="text" name="name" placeholder="Apna naam likhein" required>

        <label>📞 Number:</label>
        <input type="tel" name="number" placeholder="Apna number likhein" required>

        <label>🆔 Apni Chat ID (optional):</label>
        <input type="text" name="chatid" placeholder="Agar dena chahte ho">

        <label>💬 Message:</label>
        <textarea name="message" rows="3" placeholder="Yahan message likhein"></textarea>

        <label>😊 Emoji:</label>
        <select name="emoji">
          <option value="😀">😀 Khush</option>
          <option value="😂">😂 Hansi</option>
          <option value="❤️">❤️ Pyaar</option>
          <option value="👍">👍 Thumbs Up</option>
          <option value="🔥">🔥 Aag</option>
          <option value="😎">😎 Cool</option>
          <option value="🙏">🙏 Dhanyavaad</option>
          <option value="🎉">🎉 Celebration</option>
          <option value="🚀">🚀 Rocket</option>
          <option value="💎">💎 Premium</option>
        </select>

        <label>📷 Photo:</label>
        <input type="file" name="photo" accept="image/*">

        <label>🎥 Video:</label>
        <input type="file" name="video" accept="video/*">

        <button type="submit" class="btn btn-blue btn-full" id="submitBtn">🚀 Bhejo</button>
      </form>

      <p id="status"></p>
    </div>
  </div>

</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ================= STORAGE =================
const BOARDS_KEY = 'tg_boards_v2';

function getBoards() {
  try { return JSON.parse(localStorage.getItem(BOARDS_KEY)) || []; }
  catch { return []; }
}
function setBoards(arr) {
  localStorage.setItem(BOARDS_KEY, JSON.stringify(arr));
}

// ================= TOAST =================
function toast(msg, type='success') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = type === 'success'
    ? 'linear-gradient(145deg, #2ecc71, #27ae60)'
    : 'linear-gradient(145deg, #ff5c5c, #e63946)';
  t.style.boxShadow = type === 'success'
    ? '0 10px 30px rgba(46,204,113,0.5)'
    : '0 10px 30px rgba(230,57,70,0.5)';
  t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

// ================= CREATE =================
function toggleCreate() {
  const p = document.getElementById('createPanel');
  p.classList.toggle('open');
  if (p.classList.contains('open')) {
    setTimeout(() => document.getElementById('newBoardName').focus(), 100);
  }
}

function saveBoard() {
  const name   = document.getElementById('newBoardName').value.trim();
  const token  = document.getElementById('newToken').value.trim();
  const chatId = document.getElementById('newChatId').value.trim();

  if (!name)   { toast('Board ka naam daalo!', 'error'); return; }
  if (!token)  { toast('Token daalo!', 'error'); return; }
  if (!chatId) { toast('Chat ID daalo!', 'error'); return; }
  if (!token.includes(':')) { toast('Token galat format!', 'error'); return; }

  const boards = getBoards();
  boards.push({ id: Date.now().toString(), name, token, chatId });
  setBoards(boards);

  document.getElementById('newBoardName').value = '';
  document.getElementById('newToken').value = '';
  document.getElementById('newChatId').value = '';

  toggleCreate();
  renderBoards();
  toast('✅ Board save ho gaya!');
}

// ================= RENDER =================
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function maskToken(t) {
  if (!t || t.length < 12) return t;
  return t.slice(0, 8) + '••••' + t.slice(-4);
}
function initials(name) {
  return name.trim().split(/\s+/).map(w => w[0]).slice(0,2).join('').toUpperCase() || '📌';
}

function renderBoards() {
  const boards = getBoards();
  const list = document.getElementById('boardsList');
  const count = document.getElementById('boardCount');
  const countText = document.getElementById('boardCountText');

  count.textContent = boards.length;
  countText.textContent = boards.length + ' board' + (boards.length !== 1 ? 's' : '') + ' saved';

  if (boards.length === 0) {
    list.innerHTML = `
      <div class="empty-state">
        <div class="big">✈️</div>
        <p>Abhi koi board nahi hai.<br>
        Upar <b>+</b> dabao naya board banane ke liye.</p>
      </div>`;
    return;
  }

  list.innerHTML = boards.map(b => `
    <div class="board-card" onclick="openBoard('${b.id}')">
      <div class="name">
        <span class="avatar">${escapeHtml(initials(b.name))}</span>
        <span>${escapeHtml(b.name)}</span>
      </div>
      <div class="row"><b>Token:</b><span class="val">${maskToken(b.token)}</span></div>
      <div class="row"><b>Chat ID:</b><span class="val">${escapeHtml(b.chatId)}</span></div>
      <div class="arrow">›</div>
      <button class="del-btn" onclick="event.stopPropagation(); deleteBoard('${b.id}')" title="Delete">✕</button>
    </div>
  `).join('');
}

function deleteBoard(id) {
  if (!confirm('Ye board delete karna hai?')) return;
  setBoards(getBoards().filter(b => b.id !== id));
  renderBoards();
  toast('🗑️ Board delete ho gaya');
}

// ================= OPEN / BACK =================
let activeBoard = null;

function openBoard(id) {
  const b = getBoards().find(x => x.id === id);
  if (!b) return;

  activeBoard = b;
  document.getElementById('activeBoardName').textContent = '📌 ' + b.name;
  document.getElementById('activeBoardChat').textContent = 'Chat ID: ' + b.chatId;

  document.getElementById('dashboardView').style.display = 'none';
  document.getElementById('formView').classList.add('open');
  document.getElementById('status').textContent = '';
  document.getElementById('status').className = '';
  window.scrollTo(0, 0);
}

function goBack() {
  activeBoard = null;
  document.getElementById('formView').classList.remove('open');
  document.getElementById('dashboardView').style.display = 'block';
  document.getElementById('tgForm').reset();
  document.getElementById('status').textContent = '';
  document.getElementById('status').className = '';
}

// ================= FORM SUBMIT (FAST) =================
const form = document.getElementById('tgForm');
const statusEl = document.getElementById('status');
const submitBtn = document.getElementById('submitBtn');

function setStatus(msg, cls) {
  statusEl.innerHTML = msg;
  statusEl.className = cls || '';
}

async function sendText(api, chatId, text) {
  const fd = new FormData();
  fd.append('chat_id', chatId);
  fd.append('text', text);
  fd.append('parse_mode', 'HTML');
  return (await fetch(`${api}/sendMessage`, { method: 'POST', body: fd })).json();
}
async function sendPhoto(api, chatId, file, caption) {
  const fd = new FormData();
  fd.append('chat_id', chatId);
  fd.append('photo', file);
  fd.append('caption', caption);
  return (await fetch(`${api}/sendPhoto`, { method: 'POST', body: fd })).json();
}
async function sendVideo(api, chatId, file, caption) {
  const fd = new FormData();
  fd.append('chat_id', chatId);
  fd.append('video', file);
  fd.append('caption', caption);
  return (await fetch(`${api}/sendVideo`, { method: 'POST', body: fd })).json();
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  if (!activeBoard) return;

  submitBtn.disabled = true;
  submitBtn.textContent = '⏳ Bhej raha hoon...';
  const API = `https://api.telegram.org/bot${activeBoard.token}`;

  const name = form.name.value.trim();
  const number = form.number.value.trim();
  const chatid = form.chatid.value.trim();
  const message = form.message.value.trim();
  const emoji = form.emoji.value;

  const textMsg =
    `📩 <b>Naya Message</b>\n\n` +
    `📌 <b>Board:</b> ${activeBoard.name}\n` +
    `👤 <b>Naam:</b> ${name}\n` +
    `📞 <b>Number:</b> ${number}\n` +
    `🆔 <b>Chat ID:</b> ${chatid || 'N/A'}\n` +
    `${emoji} <b>Message:</b> ${message || 'N/A'}`;

  try {
    // ⚡ Fast: parallel bhejo (text + photo + video ek saath)
    const jobs = [];

    setStatus('<span class="spinner"></span> Text bhej raha hoon...', 'info');
    jobs.push(sendText(API, activeBoard.chatId, textMsg));

    if (form.photo.files[0]) {
      jobs.push(sendPhoto(API, activeBoard.chatId, form.photo.files[0], `📷 ${name} ki photo`));
    }
    if (form.video.files[0]) {
      jobs.push(sendVideo(API, activeBoard.chatId, form.video.files[0], `🎥 ${name} ka video`));
    }

    const results = await Promise.all(jobs);
    const failed = results.find(r => !r.ok);
    if (failed) throw new Error(failed.description || 'Telegram ne reject kiya');

    setStatus('✅ Sab kuch bhej diya!', 'success');
    toast('🚀 Message successfully bhej diya!');
    form.reset();

    // 3 sec baad status clear
    setTimeout(() => {
      if (statusEl.classList.contains('success')) {
        statusEl.textContent = '';
        statusEl.className = '';
      }
    }, 3500);

  } catch (err) {
    setStatus('❌ Error: ' + err.message, 'error');
    toast('❌ ' + err.message, 'error');
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = '🚀 Bhejo';
  }
});

// ================= INIT =================
renderBoards();
</script>
